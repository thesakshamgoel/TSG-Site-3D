<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages can't send security headers, so the parts of a policy that
         work from a meta tag go here. Script and frame sources are left open
         because Firebase sign-in and the consented embeds load from many hosts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Saksham Goel is a cinematographer, colorist and graphic designer. Film production, post production and DI, and graphic design." />
    <title>Saksham Goel | Cinematographer, Colorist &amp; Designer</title>
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Installable app (PWA): manifest, theme, and platform app metadata -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#060507" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Saksham Goel" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saksham Goel" />
    <meta property="og:title" content="Saksham Goel | Cinematographer, Colorist &amp; Designer" />
    <meta property="og:description" content="Film production, post production and DI, and graphic design." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Saksham Goel | Cinematographer, Colorist &amp; Designer" />
    <meta name="twitter:description" content="Film production, post production and DI, and graphic design." />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Saksham Goel",
        "jobTitle": "Cinematographer, Colorist and Graphic Designer",
        "url": "%VITE_SITE_URL%",
        "image": "%VITE_SITE_URL%og-image.jpg",
        "alumniOf": "Whistling Woods International",
        "sameAs": ["https://www.instagram.com/thesakshamgoel/"]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Fallback shown until the app mounts. If the bundle fails to load
           (server/host down, offline), this stays visible so visitors get a
           friendly message instead of a blank page. React replaces it on boot. -->
      <div id="app-fallback">
        <div class="afb__reel"></div>
        <p class="afb__title">Saksham Goel</p>
        <p class="afb__msg">Loading…</p>
      </div>
    </div>
    <style>
      #app-fallback{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#060507;color:#b7b5ae;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:24px;z-index:1}
      #app-fallback .afb__reel{width:54px;height:54px;border-radius:50%;border:3px solid rgba(233,184,114,.25);border-top-color:#e9b872;animation:afb-spin 1s linear infinite}
      #app-fallback .afb__title{font-family:Georgia,serif;font-size:1.5rem;color:#f6f5f2;margin:0}
      #app-fallback .afb__msg{max-width:340px;font-size:.95rem;margin:0;line-height:1.5}
      @keyframes afb-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){#app-fallback .afb__reel{animation:none}}
    </style>
    <script>
      // If the app hasn't mounted after a while, show an explicit offline note.
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var fb = document.getElementById('app-fallback')
          if (!fb) return // app mounted and replaced #root — all good
          var msg = fb.querySelector('.afb__msg')
          if (msg)
            msg.textContent = navigator.onLine
              ? "We're briefly down for maintenance — please check back in a few minutes."
              : "You appear to be offline — reconnect and this will load automatically."
        }, 8000)
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
